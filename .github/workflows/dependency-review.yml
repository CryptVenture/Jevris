# Dependency review on pull requests (BLD-12): refuses a change that adds a dependency
# with a known moderate-or-worse advisory.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
