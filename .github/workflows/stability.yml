# Stability (QA-05): the hook and sidecar suites pass 20 consecutive runs on every matrix cell.
# Weekly and on demand; no secrets. Local equivalent: npm run build && node scripts/repeat-tests.mjs
name: stability

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      runs:
        description: Consecutive runs per cell
        type: number
        default: 20

permissions:
  contents: read

jobs:
  stability:
    name: stability (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.14.0', '24', 'latest']
    steps:
      - name: Keep checkout bytes exact
        run: git config --global core.autocrlf false
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Lockfile installs drop better-sqlite3's gypfile:false and run node-gyp, which needs a
      # C++ toolchain, for a package that loads its bundled prebuilt binary (docs/development.md).
      - name: npm ci
        run: npm ci --ignore-scripts
      - name: Dependency install scripts
        run: npm rebuild esbuild
      - name: Build
        run: npm run build
      - name: Twenty consecutive hook and sidecar runs
        env:
          RUNS: ${{ inputs.runs || 20 }}
        shell: bash
        run: node scripts/repeat-tests.mjs --runs "$RUNS" --report stability-${{ matrix.os }}-${{ matrix.node }}.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stability-${{ matrix.os }}-${{ matrix.node }}
          path: stability-${{ matrix.os }}-${{ matrix.node }}.json
          if-no-files-found: error
